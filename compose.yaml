services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=storage_db'
      - 'POSTGRES_PASSWORD=bestUser'
      - 'POSTGRES_USER=bestUser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
     - '6379:6379'
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storage_db
      SPRING_DATASOURCE_USERNAME: bestUser
      SPRING_DATASOURCE_PASSWORD: bestUser
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
volumes:
  postgres_data:

