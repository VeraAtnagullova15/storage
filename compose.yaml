services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=storage_db'
      - 'POSTGRES_PASSWORD=bestUser'
      - 'POSTGRES_USER=bestUser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
     - '6379:6379'
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --address ":9010" --console-address ":9011"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9010:9010'
      - '9011:9011'
    volumes:
      - minio-data:/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storage_db
      SPRING_DATASOURCE_USERNAME: bestUser
      SPRING_DATASOURCE_PASSWORD: bestUser
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_URL: http://minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: user-files
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
volumes:
  postgres_data:
  minio-data:

