spring.application.name=storage

spring.datasource.url=jdbc:postgresql://localhost:5432/storage_db
spring.datasource.username=bestUser
spring.datasource.password=bestUser

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.session.store-type=redis
spring.session.timeout=3H

minio.url=http://localhost:9010
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket=user-files

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

logging.level.root=INFO
logging.level.ru.atnagullova.cloud_storage=DEBUG
logging.level.io.minio=DEBUG

spring.docker.compose.enabled=false
